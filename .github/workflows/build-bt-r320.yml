name: Build FanchmWrt for Globitel BT-R320

on:
  workflow_dispatch:
    inputs:
      fanchmwrt_branch:
        description: 'FanchmWrt upstream branch'
        required: true
        default: 'fanchmwrt-25.12.6'
        type: string
      apply_led_patch:
        description: 'Apply GPIO 10/11/12 RGB status LED patch'
        required: true
        default: true
        type: boolean
      include_istore:
        description: 'Include iStore app center (luci-app-store)'
        required: true
        default: true
        type: boolean
      upload_release:
        description: 'Publish artifacts to GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/fanchmwrt/fanchmwrt.git
  TZ: Asia/Shanghai
  TARGET_PROFILE: globitel_bt-r320

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Maximize runner disk space and install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex g++ gawk \
            gcc-multilib g++-multilib gettext git gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get autoremove -y -qq
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"
          df -hT

      - name: Clone FanchmWrt source
        run: |
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir
          git clone --depth=1 -b "${{ inputs.fanchmwrt_branch || 'fanchmwrt-25.12.6' }}" \
            "$UPSTREAM_REPO" /workdir/fanchmwrt
          echo "UPSTREAM_SHA=$(git -C /workdir/fanchmwrt rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Update and install feeds
        working-directory: /workdir/fanchmwrt
        run: |
          if [ "${{ inputs.include_istore }}" != "false" ]; then
            grep -q "src-git istore " feeds.conf.default || echo "src-git istore https://github.com/linkease/istore;main" >> feeds.conf.default
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare patches and config
        run: |
          chmod +x .github/scripts/prepare_fanchmwrt.sh
          ARGS=()
          [ "${{ inputs.apply_led_patch }}" = "false" ] && ARGS+=(--no-led-patch)
          [ "${{ inputs.include_istore }}" = "false" ] && ARGS+=(--no-istore)
          ./.github/scripts/prepare_fanchmwrt.sh /workdir/fanchmwrt configs/bt-r320.diffconfig "${ARGS[@]}"

      - name: Expand config and download sources
        working-directory: /workdir/fanchmwrt
        run: |
          make defconfig
          REQUIRED_SYMS=(
            CONFIG_TARGET_mediatek_filogic_DEVICE_globitel_bt-r320
            CONFIG_PACKAGE_luci-app-dockerman
            CONFIG_PACKAGE_luci-app-samba4
          )
          if [ "${{ inputs.include_istore }}" != "false" ]; then
            REQUIRED_SYMS+=(
              CONFIG_PACKAGE_luci-app-store
              CONFIG_PACKAGE_luci-compat
            )
          fi
          FAILED=0
          for sym in "${REQUIRED_SYMS[@]}"; do
            if grep -q "^${sym}=y$" .config; then
              echo "OK: ${sym}=y"
            else
              echo "MISSING/NOT_Y: ${sym}"
              grep -E "^#? ?${sym}(=| )" .config || echo "  (not present in .config)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "=== Related entries in .config ==="
            grep -E "CONFIG_PACKAGE_(luci-app-store|luci-compat|luci-lib-taskd|luci-lib-xterm|luci-lua-runtime|taskd|script-utils|coreutils-stty|mount-utils|libuci-lua|curl|tar)[= ]" .config || true
            echo "=== Package definitions in tmp/.config-package.in ==="
            awk '/^[[:space:]]*(menu)?config PACKAGE_(luci-app-store|luci-compat|luci-lib-taskd|luci-lua-runtime|taskd|tar|xz|xz-utils)$/{flag=1} flag{print} /^[[:space:]]*$/{if(flag){flag=0; print "---"}}' tmp/.config-package.in || true
            exit 1
          fi
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile FanchmWrt firmware
        working-directory: /workdir/fanchmwrt
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect BT-R320 firmware artifacts
        id: collect
        working-directory: /workdir/fanchmwrt
        run: |
          OUT_DIR="/workdir/output"
          mkdir -p "$OUT_DIR"
          BIN_DIR="bin/targets/mediatek/filogic"
          ls -la "$BIN_DIR"
          cp -f "$BIN_DIR"/*globitel_bt-r320* "$OUT_DIR"/
          (cd "$OUT_DIR" && sha256sum * > sha256sums.txt)
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> "$GITHUB_ENV"
          ls -lh "$OUT_DIR"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-bt-r320-${{ env.BUILD_DATE }}
          path: ${{ env.OUT_DIR }}
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.upload_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bt-r320-${{ env.BUILD_DATE }}"
          name: "FanchmWrt BT-R320 (${{ inputs.fanchmwrt_branch || 'fanchmwrt-25.12.6' }}) - ${{ env.BUILD_DATE }}"
          body: |
            - **Device**: Globitel BT-R320 (MT7981B / 1GB DDR4 / eMMC)
            - **Partition Mode**: Legacy eMMC `kernel` + `rootfs` (`sysupgrade.bin`, keeps existing GPT & WebUI U-Boot intact)
            - **Upstream**: `fanchmwrt/fanchmwrt` @ `${{ inputs.fanchmwrt_branch || 'fanchmwrt-25.12.6' }}` (`${{ env.UPSTREAM_SHA }}`)
            - **LED Patch (GPIO 10/11/12)**: `${{ inputs.apply_led_patch }}`
            - **iStore App Center**: `${{ inputs.include_istore }}`
            - **Extra Packages**: USB Storage (`exfat`/`ntfs3`/`f2fs`/`hd-idle`), `samba4`, `docker` + `dockerman`, `ttyd`, `zh-cn`

            > 注意：本镜像采用传统 eMMC `kernel` + `rootfs` 布局（`sysupgrade.bin`），不改写现有 GPT 分区表与既有 U-Boot。首次从其他底包迁移前请备份 `factory` 分区，并通过 WebUI U-Boot 或 `sysupgrade -n` 刷入。
          files: ${{ env.OUT_DIR }}/*
